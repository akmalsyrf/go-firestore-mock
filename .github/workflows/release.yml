name: Release

# Caution: any push of a v2.* tag triggers this workflow and creates a GitHub
# Release. Prefer tagging only from main after the gate job is green:
#   git checkout main && git pull && git tag v2.x.y && git push origin v2.x.y
on:
  push:
    tags:
      - "v2.*"

# Write scoped to this workflow only (CI uses contents: read).
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.25.x"

      - name: Prefer tags that point at main
        run: |
          git fetch origin main --depth=1 || true
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
              echo "::warning::Tag ${{ github.ref_name }} (${{ github.sha }}) is not an ancestor of origin/main. Prefer tagging from main after gate is green."
            fi
          fi

      - name: Version pairing (enforces tag ↔ version.go ↔ go.mod)
        env:
          GITHUB_REF_TYPE: tag
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          chmod +x scripts/check-version.sh
          ./scripts/check-version.sh

      - name: Install mockgen
        run: go install go.uber.org/mock/mockgen@v0.6.0
      - name: Generate-check (mocks not stale)
        run: |
          go generate ./...
          git diff --exit-code -- mocks/

      - name: Start Firestore emulator
        run: |
          docker run -d --name firestore-emulator -p 8080:8080 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli@sha256:7617d937e9360d769de4ef66266a8caae503c1dbbd050c93404d3f30045c5125 \
            gcloud beta emulators firestore start --host-port=0.0.0.0:8080
          for i in $(seq 1 60); do
            if nc -z 127.0.0.1 8080 2>/dev/null; then echo "emulator up"; exit 0; fi
            sleep 2
          done
          docker logs firestore-emulator || true
          exit 1

      - name: Accuracy gate
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
        run: |
          chmod +x scripts/check-accuracy.sh
          ./scripts/check-accuracy.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SDK=$(sed -n 's/^const FirestoreSDKVersion = "\(.*\)".*/\1/p' version.go)
          VER=$(sed -n 's/^const Version = "\(.*\)".*/\1/p' version.go)
          gh release create "${{ github.ref_name }}" \
            --title "fsmock v${VER}" \
            --notes "$(cat <<EOF
          ## fsmock v${VER}

          Paired with **cloud.google.com/go/firestore ${SDK}**.

          See [COMPATIBILITY.md](COMPATIBILITY.md) and [CHANGELOG.md](CHANGELOG.md).

          \`\`\`bash
          go get github.com/akmalsyrf/go-firestore-mock/v2@v${VER}
          \`\`\`
          EOF
          )"
